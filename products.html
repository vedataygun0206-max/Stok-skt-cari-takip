<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Ürün Yönetimi — SKT Stok & Cari Takip</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#17202a;
}

header{
  background:#17202a;
  color:white;
  padding:18px 20px;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.sub{
  margin-top:5px;
  opacity:.75;
  font-size:13px;
}

nav{
  background:white;
  padding:10px;
  display:flex;
  gap:8px;
  overflow-x:auto;
  border-bottom:1px solid #ddd;
}

nav a{
  text-decoration:none;
  color:#17202a;
  background:#eef1f4;
  padding:10px 14px;
  border-radius:8px;
  font-weight:bold;
  white-space:nowrap;
}

nav a:hover{
  background:#17202a;
  color:white;
}

main{
  max-width:1250px;
  margin:auto;
  padding:20px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:18px;
}

h1{
  margin:0;
  font-size:25px;
}

.btn{
  border:0;
  border-radius:8px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:bold;
}

.btn-primary{
  background:#17202a;
  color:white;
}

.btn-danger{
  background:#d32f2f;
  color:white;
}

.panel{
  background:white;
  border-radius:14px;
  padding:18px;
  box-shadow:0 2px 10px #00000010;
  margin-bottom:18px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:13px;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:6px;
}

input,select{
  width:100%;
  padding:11px;
  border:1px solid #ccd2d8;
  border-radius:8px;
  font-size:14px;
}

.checkbox{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:25px;
}

.checkbox input{
  width:auto;
}

.actions{
  margin-top:16px;
  display:flex;
  gap:10px;
}

.search{
  margin-bottom:15px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:11px;
  border-bottom:1px solid #eee;
  text-align:left;
  font-size:14px;
}

th{
  background:#f0f2f4;
}

.badge{
  padding:5px 8px;
  border-radius:6px;
  background:#e8f5e9;
  color:#176b32;
  font-weight:bold;
}

@media(max-width:650px){
  main{padding:12px}
  .top{
    align-items:flex-start;
    flex-direction:column;
  }

  table{
    min-width:850px;
  }

  .panel{
    overflow-x:auto;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">📦 SKT Stok & Cari Takip</div>
  <div class="sub">Market Yönetim ve Stok Kontrol Sistemi</div>
</header>

<nav>
  <a href="/index.html">🏠 Ana Sayfa</a>
  <a href="/products.html">📦 Ürünler</a>
  <a href="/stock.html">📊 Stok</a>
  <a href="/skt.html">⏰ SKT</a>
  <a href="/cari.html">🧾 Cari</a>
  <a href="/kasa.html">💰 Kasa</a>
  <a href="/pos.html">🛒 POS</a>
  <a href="/reports.html">📈 Raporlar</a>
</nav>

<main>

<div class="top">
  <div>
    <h1>📦 Ürün Yönetimi</h1>
    <div>Ürün kartları, fiyatlar ve temel ürün bilgileri</div>
  </div>

  <button class="btn btn-primary" onclick="showForm()">
    ➕ Yeni Ürün
  </button>
</div>

<div class="panel" id="formPanel" style="display:none">

  <h2>Yeni Ürün</h2>

  <form id="productForm">

    <div class="form-grid">

      <div>
        <label>Firma ID</label>
        <input
          type="number"
          id="firma_id"
          required
          placeholder="Firma ID"
        >
      </div>

      <div>
        <label>Kategori ID</label>
        <input
          type="number"
          id="kategori_id"
          placeholder="Kategori ID"
        >
      </div>

      <div>
        <label>Birim ID</label>
        <input
          type="number"
          id="birim_id"
          required
          placeholder="Örn. 1"
        >
      </div>

      <div>
        <label>Ürün Kodu</label>
        <input
          type="text"
          id="kod"
          required
          placeholder="Örn. 100001"
        >
      </div>

      <div>
        <label>Ürün Adı</label>
        <input
          type="text"
          id="ad"
          required
          placeholder="Ürün adı"
        >
      </div>

      <div>
        <label>Marka</label>
        <input
          type="text"
          id="marka"
          placeholder="Marka"
        >
      </div>

      <div>
        <label>Alış Fiyatı</label>
        <input
          type="number"
          step="0.01"
          id="alis_fiyati"
          value="0"
        >
      </div>

      <div>
        <label>Satış Fiyatı</label>
        <input
          type="number"
          step="0.01"
          id="satis_fiyati"
          value="0"
        >
      </div>

      <div>
        <label>Minimum Stok</label>
        <input
          type="number"
          step="0.001"
          id="minimum_stok"
          value="0"
        >
      </div>

      <div>
        <label>KDV Oranı (%)</label>
        <input
          type="number"
          step="0.01"
          id="kdv_orani"
          value="0"
        >
      </div>

      <div class="checkbox">
        <input
          type="checkbox"
          id="tartili_urun"
        >
        <label for="tartili_urun">
          ⚖️ Tartılı Ürün
        </label>
      </div>

    </div>

    <div class="actions">

      <button
        type="submit"
        class="btn btn-primary"
      >
        💾 Ürünü Kaydet
      </button>

      <button
        type="button"
        class="btn"
        onclick="hideForm()"
      >
        İptal
      </button>

    </div>

  </form>

</div>


<div class="panel">

  <input
    class="search"
    type="search"
    id="search"
    placeholder="🔎 Ürün kodu, adı veya marka ara..."
    oninput="filterProducts()"
  >

  <table>

    <thead>
      <tr>
        <th>Kod</th>
        <th>Ürün</th>
        <th>Marka</th>
        <th>Birim</th>
        <th>Alış</th>
        <th>Satış</th>
        <th>KDV</th>
        <th>Durum</th>
      </tr>
    </thead>

    <tbody id="productRows">
      <tr>
        <td colspan="8">
          Ürünler yükleniyor...
        </td>
      </tr>
    </tbody>

  </table>

</div>

</main>


<script>

let products = [];


function showForm(){
  document.getElementById("formPanel").style.display = "block";
  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


function hideForm(){
  document.getElementById("formPanel").style.display = "none";
}


async function loadProducts(){

  try{

    const response =
      await fetch("/api/urunler");

    if(!response.ok){
      throw new Error("Ürün API hatası");
    }

    products =
      await response.json();

    renderProducts(products);

  }catch(error){

    console.error(error);

    document.getElementById("productRows").innerHTML =
      '<tr><td colspan="8">Ürünler yüklenemedi.</td></tr>';

  }

}


function renderProducts(list){

  const rows =
    document.getElementById("productRows");

  if(!list.length){

    rows.innerHTML =
      '<tr><td colspan="8">Henüz ürün bulunmuyor.</td></tr>';

    return;
  }


  rows.innerHTML =
    list.map(p => `

      <tr>

        <td>${esc(p.kod)}</td>

        <td>${esc(p.ad)}</td>

        <td>${esc(p.marka || "-")}</td>

        <td>${esc(p.birim_sembol || "-")}</td>

        <td>${money(p.alis_fiyati)}</td>

        <td>${money(p.satis_fiyati)}</td>

        <td>${Number(p.kdv_orani || 0)}%</td>

        <td>
          <span class="badge">
            Aktif
          </span>
        </td>

      </tr>

    `).join("");

}


function filterProducts(){

  const q =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  const filtered =
    products.filter(p =>
      String(p.kod || "").toLowerCase().includes(q) ||
      String(p.ad || "").toLowerCase().includes(q) ||
      String(p.marka || "").toLowerCase().includes(q)
    );

  renderProducts(filtered);

}


function money(value){

  return Number(value || 0)
    .toLocaleString("tr-TR",{
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }) + " ₺";

}


function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g,m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[m]));

}


document
  .getElementById("productForm")
  .addEventListener("submit", async function(e){

    e.preventDefault();

    const body = {

      firma_id:
        Number(document.getElementById("firma_id").value),

      kategori_id:
        document.getElementById("kategori_id").value
          ? Number(document.getElementById("kategori_id").value)
          : null,

      birim_id:
        Number(document.getElementById("birim_id").value),

      kod:
        document.getElementById("kod").value.trim(),

      ad:
        document.getElementById("ad").value.trim(),

      marka:
        document.getElementById("marka").value.trim(),

      alis_fiyati:
        Number(document.getElementById("alis_fiyati").value || 0),

      satis_fiyati:
        Number(document.getElementById("satis_fiyati").value || 0),

      minimum_stok:
        Number(document.getElementById("minimum_stok").value || 0),

      kdv_orani:
        Number(document.getElementById("kdv_orani").value || 0),

      tartili_urun:
        document.getElementById("tartili_urun").checked

    };


    try{

      const response =
        await fetch("/api/urunler",{

          method:"POST",

          headers:{
            "content-type":"application/json"
          },

          body:JSON.stringify(body)

        });


      const result =
        await response.json();


      if(!response.ok){

        alert(
          "❌ Ürün kaydedilemedi:\n" +
          (result.error || "Bilinmeyen hata")
        );

        return;
      }


      alert("✅ Ürün başarıyla kaydedildi.");

      document
        .getElementById("productForm")
        .reset();

      hideForm();

      loadProducts();


    }catch(error){

      alert(
        "❌ Sunucu bağlantısı kurulamadı."
      );

    }

});


loadProducts();

</script>

</body>
</html>
