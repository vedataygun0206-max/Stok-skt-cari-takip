<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Firma Yönetimi — SKT Stok & Cari Takip</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#17202a;
}

header{
  background:#17202a;
  color:white;
  padding:18px 20px;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.sub{
  margin-top:5px;
  opacity:.75;
  font-size:13px;
}

nav{
  background:white;
  padding:10px;
  display:flex;
  gap:8px;
  overflow-x:auto;
  border-bottom:1px solid #ddd;
}

nav a{
  text-decoration:none;
  color:#17202a;
  background:#eef1f4;
  padding:10px 14px;
  border-radius:8px;
  font-weight:bold;
  white-space:nowrap;
}

main{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

h1{
  margin:0;
}

.panel{
  background:white;
  padding:20px;
  border-radius:14px;
  box-shadow:0 2px 10px #00000010;
  margin-bottom:18px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:14px;
}

label{
  display:block;
  font-weight:bold;
  font-size:13px;
  margin-bottom:6px;
}

input,textarea{
  width:100%;
  padding:11px;
  border:1px solid #ccd2d8;
  border-radius:8px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.btn{
  border:0;
  padding:11px 16px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.btn-primary{
  background:#17202a;
  color:white;
}

.actions{
  margin-top:16px;
  display:flex;
  gap:10px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:11px;
  border-bottom:1px solid #eee;
  text-align:left;
}

th{
  background:#f0f2f4;
}

.badge{
  padding:5px 8px;
  border-radius:6px;
  background:#e8f5e9;
  color:#176b32;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
  <div class="logo">📦 SKT Stok & Cari Takip</div>
  <div class="sub">Market Yönetim ve Stok Kontrol Sistemi</div>
</header>

<nav>
  <a href="/index.html">🏠 Ana Sayfa</a>
  <a href="/firmalar.html">🏢 Firmalar</a>
  <a href="/products.html">📦 Ürünler</a>
  <a href="/stock.html">📊 Stok</a>
  <a href="/skt.html">⏰ SKT</a>
  <a href="/cari.html">🧾 Cari</a>
  <a href="/kasa.html">💰 Kasa</a>
  <a href="/pos.html">🛒 POS</a>
  <a href="/reports.html">📈 Raporlar</a>
</nav>

<main>

<div class="top">
  <div>
    <h1>🏢 Firma Yönetimi</h1>
    <div>Firma kayıtları ve temel firma bilgileri</div>
  </div>

  <button class="btn btn-primary"
          onclick="showForm()">
    ➕ Yeni Firma
  </button>
</div>

<div class="panel" id="formPanel">

<h2>Yeni Firma</h2>

<form id="firmaForm">

<div class="form-grid">

<div>
<label>Firma Adı</label>
<input id="ad" required>
</div>

<div>
<label>Vergi No</label>
<input id="vergi_no">
</div>

<div>
<label>Telefon</label>
<input id="telefon">
</div>

<div>
<label>E-posta</label>
<input id="email" type="email">
</div>

<div style="grid-column:1/-1">
<label>Adres</label>
<textarea id="adres"></textarea>
</div>

</div>

<div class="actions">

<button class="btn btn-primary" type="submit">
💾 Firmayı Kaydet
</button>

<button class="btn" type="button"
        onclick="hideForm()">
İptal
</button>

</div>

</form>

</div>

<div class="panel">

<h2>Firmalar</h2>

<table>

<thead>
<tr>
<th>ID</th>
<th>Firma</th>
<th>Vergi No</th>
<th>Telefon</th>
<th>E-posta</th>
<th>Durum</th>
</tr>
</thead>

<tbody id="firmaRows">
<tr>
<td colspan="6">Yükleniyor...</td>
</tr>
</tbody>

</table>

</div>

</main>

<script>

let firmalar=[];

function showForm(){
  document.getElementById("formPanel").style.display="block";
}

function hideForm(){
  document.getElementById("formPanel").style.display="none";
}

async function loadFirmalar(){

  try{

    const r=await fetch("/api/firmalar");

    if(!r.ok) throw new Error("API");

    firmalar=await r.json();

    renderFirmalar();

  }catch(e){

    document.getElementById("firmaRows").innerHTML=
      '<tr><td colspan="6">Firmalar yüklenemedi.</td></tr>';

  }

}

function renderFirmalar(){

  const rows=document.getElementById("firmaRows");

  if(!firmalar.length){

    rows.innerHTML=
      '<tr><td colspan="6">Henüz firma bulunmuyor.</td></tr>';

    return;
  }

  rows.innerHTML=firmalar.map(f=>`

    <tr>
      <td>${f.id}</td>
      <td>${esc(f.ad)}</td>
      <td>${esc(f.vergi_no||"-")}</td>
      <td>${esc(f.telefon||"-")}</td>
      <td>${esc(f.email||"-")}</td>
      <td><span class="badge">Aktif</span></td>
    </tr>

  `).join("");

}

document.getElementById("firmaForm")
.addEventListener("submit",async function(e){

  e.preventDefault();

  const body={
    ad:document.getElementById("ad").value.trim(),
    vergi_no:document.getElementById("vergi_no").value.trim(),
    telefon:document.getElementById("telefon").value.trim(),
    email:document.getElementById("email").value.trim(),
    adres:document.getElementById("adres").value.trim()
  };

  try{

    const r=await fetch("/api/firmalar",{
      method:"POST",
      headers:{
        "content-type":"application/json"
      },
      body:JSON.stringify(body)
    });

    const data=await r.json();

    if(!r.ok){

      alert("❌ "+(data.error||"Firma kaydedilemedi."));
      return;

    }

    alert("✅ Firma başarıyla kaydedildi.");

    document.getElementById("firmaForm").reset();

    hideForm();

    loadFirmalar();

  }catch(e){

    alert("❌ Sunucu bağlantısı kurulamadı.");

  }

});

function esc(v){

  return String(v??"")
    .replace(/[&<>"']/g,m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[m]));

}

loadFirmalar();

</script>

</body>
</html>
